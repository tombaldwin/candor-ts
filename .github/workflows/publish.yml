name: publish

# Trusted publishing to npm via GitHub Actions OIDC — no stored NPM_TOKEN. A `v*` tag (or a manual
# dispatch) publishes the current package.json version with signed provenance. The version is NOT
# bumped here: tag a commit whose package.json already carries the release version (the lockstep cut).
# One-time setup on npmjs.com: candor-ts → Settings → Trusted Publisher → GitHub Actions,
# repo `tombaldwin/candor-ts`, workflow `publish.yml`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # A deadline. With no `timeout-minutes` GitHub's 6-hour default applies, so a stuck runner
    # blocks the release gate (release-preflight [10] reads CI green on HEAD) while looking
    # exactly like a slow job — measured twice on 2026-08-19, at 3h45m and 54m. Gated by
    # release-preflight [7b], which asks every workflow in every released repo.
    timeout-minutes: 20
    permissions:
      id-token: write   # OIDC — this is what authenticates the publish; no secret is stored
      contents: read
      actions: read     # to ask whether ci.yml already passed this exact commit (see the battery step)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest
      - run: npm install --no-fund --no-audit
      # Gate: the same full battery as ci.yml — behavioral + fabrication probe + §7.13 fuzzer.
      # A broken build must not reach npm.
      #
      # …but not TWICE over the same bytes. `release.sh` cannot tag until release-preflight [10] sees CI
      # green on HEAD, so by the time this workflow runs, ci.yml has already executed `npm test` on this
      # exact SHA — and more besides (transitive-recall, self-gate). Re-running it cost 12 minutes on the
      # 0.30.0 cut, and that 12 minutes is the release's critical path: the pin bump cannot be pushed
      # until npm carries the package, because the pin starts the IDE jobs that install it.
      #
      # FAIL-CLOSED: the battery is skipped only when a SUCCESSFUL ci.yml run exists for this exact
      # commit. No run, a failed run, an API hiccup, or a manual workflow_dispatch on an untested commit
      # all leave `green` false and the battery runs. The guard can only ever cost a duplicate run.
      - name: Has ci.yml already passed this exact commit?
        id: ciseen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                --json conclusion -q '[.[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
          echo "successful ci.yml runs at $GITHUB_SHA: ${n:-0}"
          if [ "${n:-0}" -ge 1 ]; then echo "green=true" >> "$GITHUB_OUTPUT"; else echo "green=false" >> "$GITHUB_OUTPUT"; fi
      - name: Full test battery (behavioral + probe + fuzzer)
        if: steps.ciseen.outputs.green != 'true'
        run: npm test
      - name: Battery skipped — ci.yml is green on this exact commit
        if: steps.ciseen.outputs.green == 'true'
        run: echo "ci.yml ran the same \`npm test\` battery on $GITHUB_SHA and passed; not repeating it." 
      # Idempotency guard: the release cycle sometimes publishes this version manually before the tag
      # lands (release-verify needs it live synchronously), so the tag-triggered run would otherwise
      # red-fail with "cannot publish over the previously published versions". Skip cleanly when the
      # version is already on npm — a duplicate is a no-op, not a failure. When THIS run wins the race it
      # still publishes with OIDC provenance (the preferred path).
      - name: Skip if this version is already on npm
        id: exists
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "candor-ts@$V" version >/dev/null 2>&1; then
            echo "candor-ts@$V is already published — nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (provenance via OIDC)
        if: steps.exists.outputs.published == 'false'
        run: npm publish --provenance --access public

  mcp_registry:
    # Publish server.json to the official MCP Registry so agents and directories can DISCOVER candor,
    # instead of a human pasting instructions that tell an agent to fetch and read a remote file. That
    # is the install route this job exists to replace: discovery is passive, and the registration
    # instructions themselves keep coming from the package you already installed (`candor mcp --help`,
    # `candor mcp install`), never from a URL.
    #
    # `needs: publish` because the registry verifies namespace ownership by fetching the PUBLISHED npm
    # README and looking for the visible `mcp-name:` marker — so the package carrying that marker has to
    # be live first. GitHub OIDC proves the io.github.tombaldwin namespace, so no secret is stored.
    # Isolated from the publish job: a registry hiccup must not affect an npm release that already
    # succeeded.
    name: publish to MCP Registry
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.repository.fork
    runs-on: ubuntu-latest
    # Every job declares one — release-preflight [7b] gates it, and caught this job missing it before
    # the cut. The publish step retries 5x with 30s backoff for npm README propagation, so the real
    # ceiling is a few minutes; 15 leaves room for a slow registry without letting a hang hold a
    # release for the six hours GitHub would otherwise allow.
    timeout-minutes: 15
    permissions:
      id-token: write   # GitHub OIDC → registry namespace auth
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sync server.json version to the release tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Install mcp-publisher
        # PINNED AND CHECKSUMMED, deliberately. This step runs in a job holding `id-token: write`, so
        # whatever it downloads can mint an OIDC token for the whole io.github.tombaldwin namespace.
        # Fetching `releases/latest` and piping it into tar would hand that token to an unreviewed
        # binary on every release. Bump the version and the hash together, never one alone.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL "$url" -o mcp-publisher.tar.gz
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        # npm's rendered README — which the registry reads to verify the mcp-name marker — can lag a
        # publish by up to a minute, so retry rather than fail a fresh release on propagation timing.
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "publish attempt $attempt failed; the npm README may not have propagated yet — retrying in 30s"
            sleep 30
          done
          echo "mcp-publisher failed after 5 attempts"
          exit 1

