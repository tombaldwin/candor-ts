name: ci

# The product's own gate: behavioral tests + the §7.13 soundness fuzzer (teeth-verified locally;
# CI keeps it red-on-regression). Cross-engine conformance runs in candor-spec's CI, not here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # npm ci against the COMMITTED lockfile — a bare `npm install` let the gate float on whatever
      # `typescript ^6` / eslint majors resolved to that day (an untested toolchain deciding CI red/green).
      - run: npm ci --no-fund --no-audit
      # `npm test` runs the whole battery: behavioral (test/mcp/watch) + the fabrication probe + the
      # §7.13 soundness fuzzer. Driving it through the script keeps CI in lockstep with `npm test` so a
      # gate added locally can't be silently missing here (the probe + mcp/watch suites used to be).
      - name: Full test battery (behavioral + probe + fuzzer)
        run: npm test
      # How far UP a call chain can this arm's oracle actually see? It walks the stack at the effect and
      # charges every project frame, so a synchronous caller is checked — but a JS stack is cut at each
      # asynchronous boundary, and callers suspended above one are gone when the effect fires. The battery
      # measures where that line falls and reds only on a BLIND frame: a caller provably on the causal path
      # that candor claims complete-pure and no oracle in this arm could contradict.
      - name: Transitive-recall battery (how far up a chain the oracle can falsify)
        run: npm run test:transitive-recall
      - name: Effect-set oracle (the 20 shared cases)
        run: |
          git clone --depth 1 https://github.com/tombaldwin/candor-spec /tmp/spec
          node scan.mjs Cases.ts /tmp/out
          node check.mjs /tmp/out.json /tmp/spec/conformance/expected.json
